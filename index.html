<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Cronograma 2027 – Planejamento Estratégico, APO e Orçamento</title>
<style>
:root{color-scheme:light;--bg:#eef1f6;--card:#fff;--tx:#0f172a;--mu:#475569;--bd:#d5dce8;--navy:#0f2747;--ac:#1d4ed8;--ok:#15803d;--ba:#b91c1c;--ni:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:22px 32px 0}
.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;max-width:1320px;margin:auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}h1 small{display:block;font-size:13px;font-weight:400;color:#b4c3dc;margin-top:3px}
.meta{display:flex;gap:12px;align-items:center;color:#b4c3dc;font-size:12px;padding-bottom:6px}
.meta button{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.meta .add-btn{background:#1d4ed8;color:#fff}
nav{display:flex;gap:2px;max-width:1320px;margin:14px auto 0}
nav button{background:none;border:0;color:#b4c3dc;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:#60a5fa}
main{max-width:1320px;margin:auto;padding:24px 32px 48px}
.banner{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.banner.ok{background:#f0fdf4;border-color:#86efac;color:#14532d}
.banner.info{background:#eff6ff;border-color:#93c5fd;color:#1e3a8a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;box-shadow:0 1px 2px rgba(15,39,71,.06)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{border-top:4px solid var(--ac)}.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.2}.kpi span{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
h3{margin:0 0 16px;font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.row{margin-bottom:14px}.row>div:first-child{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.bar{height:10px;background:#dbe2ee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.donut{width:160px;height:160px;border-radius:50%;margin:6px auto;display:grid;place-items:center}
.donut div{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:700;line-height:1.1}
.donut small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mu)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sub{color:var(--mu);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools select,.tools input{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit}.tools input{min-width:240px}
.tw{overflow-x:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--navy);background:#e6ecf5;padding:12px 14px;border-bottom:2px solid #b9c5d8;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:nth-child(even) td{background:#f8fafc}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pc{display:flex;align-items:center;gap:8px;min-width:120px}.pc .bar{flex:1;height:8px}
.gl{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:center;font-size:12px;margin-bottom:6px}.gl>div:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gt{position:relative;height:18px;background:#f1f4f9;border-radius:4px}.gt span{position:absolute;top:3px;height:12px;border-radius:4px;min-width:4px}
.gt:after{content:"";position:absolute;left:var(--t);top:-3px;bottom:-3px;width:2px;background:var(--ba)}
.empty{color:var(--mu);padding:8px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #b4c3dc;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,39,71,.45);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px 32px;width:100%;max-width:560px;box-shadow:0 8px 32px rgba(15,39,71,.18);position:relative;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 20px;font-size:17px;color:var(--navy)}
.modal .close{position:absolute;top:16px;right:18px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mu);line-height:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit;color:var(--tx);background:#fff;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--ac)}
.form-group textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 20px;border-radius:8px;border:0;font:inherit;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--ac);color:#fff}
.btn-secondary{background:#e2e8f0;color:var(--tx)}
.pct-in{width:58px;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;font:inherit;font-weight:700;text-align:right;background:#fff;color:var(--tx)}
.pct-in:focus{outline:none;border-color:var(--ac)}
.range-hint{font-size:11px;color:var(--mu);margin-top:2px}
.req{color:var(--ba)}
.act-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--mu);margin-right:4px;transition:all .15s}
.act-btn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.act-btn.del:hover{background:var(--ba);border-color:var(--ba)}
@media(max-width:640px){header,main{padding-left:16px;padding-right:16px}.gl{grid-template-columns:110px 1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:1}}
</style></head><body>
<div class="overlay" id="modalOverlay" onclick="if(event.target===this)fecharModal()">
<div class="modal">
<button class="close" onclick="fecharModal()">✕</button>
<h2 id="modalTitulo">➕ Nova Atividade / Entrega</h2>
<form id="formAtividade" onsubmit="salvarAtividade(event)">
<input id="editIndex" type="hidden" value=""/>
<div class="form-grid">
<div class="form-group full">
<label>Frente <span class="req">*</span></label>
<select id="fFrente" onchange="toggleNovaFrente(this)" required="">
<option value="">Selecione a frente</option>
<option>Planejamento Estratégico</option>
<option>APO</option>
<option>Orçamento</option>
<option value="__novo__">+ Nova frente...</option>
</select>
<input id="fFrenteNova" placeholder="Nome da nova frente" style="display:none;margin-top:6px" type="text"/>
</div>
<div class="form-group full">
<label>Entrega / Atividade <span class="req">*</span></label>
<input id="fEntrega" placeholder="Descreva a entrega ou atividade" required="" type="text"/>
</div>
<div class="form-group full">
<label>Responsável</label>
<input id="fResponsavel" placeholder="Nome do responsável" type="text"/>
</div>
<div class="form-group">
<label>Data de Início <span class="req">*</span></label>
<input id="fInicio" oninput="calcStatus()" required="" type="date"/>
</div>
<div class="form-group">
<label>Data de Fim <span class="req">*</span></label>
<input id="fFim" oninput="calcStatus()" required="" type="date"/>
</div>
<div class="form-group">
<label>% Conclusão</label>
<input id="fPct" max="100" min="0" oninput="calcStatus()" type="number" value="0"/>
<span class="range-hint">0 = não iniciado · 100 = concluído</span>
</div>
<div class="form-group">
<label>Status (automático)</label>
<input id="fStatus" readonly="" style="background:#f8fafc;color:var(--mu)" type="text"/>
</div>
<div class="form-group full">
<label>Observações</label>
<textarea id="fObs" placeholder="Informações adicionais, links, dependências..."></textarea>
</div>
</div>
<div class="form-actions">
<button class="btn btn-secondary" onclick="fecharModal()" type="button">Cancelar</button>
<button class="btn btn-primary" id="btnSalvar" type="submit">💾 Salvar Atividade</button>
</div>
</form>
</div>
</div>
<header>
<div class="top">
<h1>Cronograma 2027<small>Planejamento Estratégico, APO e Orçamento</small></h1>
<div class="meta">
<span id="upd"></span>
<button onclick="irFrentes()">＋ Nova Frente</button>
<button class="add-btn" onclick="abrirModal()">＋ Nova Atividade</button>
<button onclick="load()">🔄 Atualizar</button>
</div>
</div>
<nav>
<button class="on" data-t="dash">Dashboard</button>
<button data-t="cron">Cronograma</button>
<button data-t="frentes">Frentes</button>
<button data-t="novo">＋ Lançar Atividade</button>
</nav>
</header>
<main><div id="ban"></div><div id="root"></div></main>
<script>
/* ===== CONFIGURAÇÃO ===== */
const CONFIG = {
  CSV_URL: "https://script.google.com/macros/s/AKfycbw2Ty3byDNEAkVazzR91hOtSn-aOo8zRcP22gZpRX7CSAZ8KED7F6LQwlDflDEnfsaT/exec",
  REFRESH_MIN: 5
};
/* ======================== */

const COL={"Concluído":"#15803d","Em andamento":"#1d4ed8","Atrasado":"#b91c1c","Não iniciado":"#64748b"};
const PAL=["#1d4ed8","#0f766e","#b45309","#7c3aed","#be185d","#0369a1"];
let D=[],tab="dash",F={q:"",f:"",s:"",r:""};
const $=s=>document.querySelector(s);
const T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
const fd=d=>d?d.split("-").reverse().join("/"):"-";

function pd(s){
  s=String(s||"").trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){let y=m[3].length==2?"20"+m[3]:m[3];return`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return""
}

function parseCsv(t){
  const r=[];let w=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){w.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;w.push(f);r.push(w);w=[];f=""}
    else f+=c
  }
  if(f||w.length){w.push(f);r.push(w)}
  return r.filter(a=>a.some(x=>x.trim()))
}

// Detecta linhas de cabeçalho duplicado ou placeholder
const PLACEHOLDERS=["frente","entrega","responsavel","responsável","inicio","início","fim","status","observ","obs"];
function isPlaceholder(row){
  const v=row.slice(0,2).map(x=>norm(String(x||"")));
  return v.length>=2&&PLACEHOLDERS.includes(v[0])&&PLACEHOLDERS.includes(v[1]);
}

function build(rows,hasHead){
  let ix={f:0,d:1,r:2,i:3,e:4,p:5,o:6,l:-1};
  if(hasHead){
    const h=rows.shift().map(norm),g=k=>h.findIndex(x=>x.startsWith(k));
    const m={f:g("frente"),d:g("entrega"),r:g("respons"),i:g("inicio"),e:g("fim"),p:Math.max(g("conclus"),g("perc"),g("pct")),o:g("obs"),l:g("linha")};
    Object.keys(m).forEach(k=>{if(m[k]>=0)ix[k]=m[k]});
  }
  return rows
    .filter(a=>!isPlaceholder(a))
    .map(a=>({
      f:(a[ix.f]||"").trim()||"Sem frente",
      d:(a[ix.d]||"").trim(),
      r:(a[ix.r]||"").trim()||"",
      i:pd(a[ix.i]),e:pd(a[ix.e]),
      p:Math.max(0,Math.min(100,parseFloat(String(a[ix.p]||"0").replace("%","").replace(",","."))||0)),
      o:(a[ix.o]||"").trim(),
      l:ix.l>=0?(parseInt(a[ix.l])||0):0
    }))
    .filter(x=>x.d&&x.d.length>1)
}

const st=x=>x.p>=100?"Concluído":(x.e&&x.e<T)?"Atrasado":(x.p==0&&x.i&&x.i>T)?"Não iniciado":"Em andamento";
const porInicio=(a,b)=>(a.i||'9999')<(b.i||'9999')?-1:(a.i||'9999')>(b.i||'9999')?1:(a.e||'9999')<(b.e||'9999')?-1:(a.e||'9999')>(b.e||'9999')?1:0;
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x.p,0)/a.length):0;
const pill=s=>`<span class="pill" style="background:${COL[s]}1f;color:${COL[s]}">${s}</span>`;
const uniq=k=>[...new Set(D.map(x=>x[k]))];
const fcol=f=>PAL[Math.max(0,frentes().indexOf(f))%PAL.length];
const prog=(l,a,c)=>`<div class="row"><div><span>${esc(l)} <span class="sub">(${a.length})</span></span><b>${avg(a)}%</b></div><div class="bar"><i style="width:${avg(a)}%;background:${c}"></i></div></div>`;

/* ── DASHBOARD ── */
function dash(){
  const it=D;
  if(!it.length)return`<div class="card" style="text-align:center;padding:48px 24px">
    <div style="font-size:52px;margin-bottom:12px">📋</div>
    <h3 style="color:var(--navy);margin:0 0 8px">Nenhuma atividade cadastrada</h3>
    <p style="color:var(--mu);margin:0 0 20px">Clique em <b>＋ Nova Atividade</b> para começar,<br>ou aguarde a sincronização com o Google Sheets.</p>
    <button class="btn btn-primary" onclick="abrirModal()">＋ Adicionar primeira atividade</button>
  </div>`;
  const c={};Object.keys(COL).forEach(k=>c[k]=it.filter(x=>st(x)==k).length);
  let a=0,g=[];Object.keys(COL).forEach(k=>{const n=c[k]/it.length*100;g.push(`${COL[k]} ${a}% ${a+n}%`);a+=n});
  const late=it.filter(x=>st(x)=="Atrasado").sort((x,y)=>x.e<y.e?-1:1);
  const nx=it.filter(x=>x.p<100&&x.e>=T).sort((x,y)=>x.e<y.e?-1:1).slice(0,6);
  const ds=it.flatMap(x=>[x.i,x.e]).filter(Boolean).sort();
  const mn=ds[0],mx=ds[ds.length-1],sp=(new Date(mx)-new Date(mn))||1;
  const pos=d=>Math.max(0,Math.min(100,(new Date(d)-new Date(mn))/sp*100));
  const list=(l,w)=>l.length?l.map(x=>`<div class="row"><div><span>${esc(x.d)}</span><b style="color:${w?"var(--ba)":"inherit"}">${fd(x.e)}</b></div><div class="sub">${esc(x.r)||"Sem responsável"} · ${esc(x.f)}</div></div>`).join(""):'<div class="empty">Nada por aqui.</div>';
  return`<div class="kpis">
    <div class="card kpi"><b>${avg(it)}%</b><span>Conclusão geral</span></div>
    <div class="card kpi"><b>${it.length}</b><span>Entregas</span></div>
    <div class="card kpi" style="border-color:var(--ok)"><b style="color:var(--ok)">${c["Concluído"]}</b><span>Concluídas</span></div>
    <div class="card kpi"><b style="color:var(--ac)">${c["Em andamento"]}</b><span>Em andamento</span></div>
    <div class="card kpi" style="border-color:var(--ba)"><b style="color:var(--ba)">${c["Atrasado"]}</b><span>Atrasadas</span></div>
    <div class="card kpi" style="border-color:var(--navy)"><b>${fd(mx)}</b><span>Prazo final</span></div>
  </div>
  <div class="grid">
    <div class="card"><h3>Status das entregas</h3>
      <div class="donut" style="background:conic-gradient(${g.join(",")})"><div>${avg(it)}%<small>concluído</small></div></div>
      <div class="leg">${Object.keys(COL).map(k=>`<span><i class="dot" style="background:${COL[k]}"></i>${k} (${c[k]})</span>`).join("")}</div>
    </div>
    <div class="card"><h3>Progresso por frente</h3>${frentes().map(f=>prog(f,it.filter(x=>x.f==f),fcol(f))).join("")}</div>
    <div class="card"><h3>Progresso por responsável</h3>${uniq("r").filter(Boolean).map(r=>prog(r,it.filter(x=>x.r==r),"var(--navy)")).join("")||'<div class="empty">Nenhum responsável definido.</div>'}</div>
  </div>
  <div class="grid">
    <div class="card"><h3>Entregas atrasadas</h3>${list(late,1)}</div>
    <div class="card"><h3>Próximos vencimentos</h3>${list(nx)}</div>
  </div>
  <div class="card"><h3>Linha do tempo</h3>
    ${it.filter(x=>x.i&&x.e).map(x=>`<div class="gl"><div title="${esc(x.d)}">${esc(x.d)}</div><div class="gt" style="--t:${pos(T)}%"><span style="left:${pos(x.i)}%;width:${Math.max(.6,pos(x.e)-pos(x.i))}%;background:${fcol(x.f)}"></span></div></div>`).join("")}
    <div class="sub" style="margin-top:10px">Linha vermelha = hoje · ${fd(mn)} a ${fd(mx)}</div>
  </div>`
}

/* ── CRONOGRAMA (tabela) ── */
function cron(){
  const q=F.q.toLowerCase();
  const it=D.filter(x=>(!F.f||x.f==F.f)&&(!F.s||st(x)==F.s)&&(!F.r||x.r==F.r)&&(!q||(x.d+" "+x.r+" "+x.o).toLowerCase().includes(q))).sort(porInicio);
  const opt=(l,arr,v)=>`<option value="">${l}</option>`+arr.map(a=>`<option ${v==a?"selected":""}>${esc(a)}</option>`).join("");
  return`<div class="tools">
    <input id="qi" placeholder="Buscar entrega, responsável..." value="${esc(F.q)}" oninput="F.q=this.value;draw(1)">
    <select onchange="F.f=this.value;draw()">${opt("Todas as frentes",uniq("f"),F.f)}</select>
    <select onchange="F.r=this.value;draw()">${opt("Todos os responsáveis",uniq("r").filter(Boolean),F.r)}</select>
    <select onchange="F.s=this.value;draw()">${opt("Todos os status",Object.keys(COL),F.s)}</select>
    <button class="btn btn-primary" onclick="abrirModal()" style="margin-left:auto">＋ Nova Atividade</button>
  </div>
  <div class="card tw"><table>
    <tr><th>Frente</th><th style="width:28%">Entrega</th><th>Responsável</th><th>Início</th><th>Fim</th><th>Conclusão</th><th>Status</th><th>Obs.</th><th>Ações</th></tr>
    ${it.length?it.map(x=>{const gi=D.indexOf(x);return`<tr>
      <td><i class="dot" style="background:${fcol(x.f)}"></i>${esc(x.f)}</td>
      <td>${esc(x.d)}</td>
      <td>${esc(x.r)||'<span class="sub">—</span>'}</td>
      <td>${fd(x.i)}</td><td>${fd(x.e)}</td>
      <td><div class="pc"><div class="bar"><i style="width:${x.p}%;background:${COL[st(x)]}"></i></div><input class="pct-in" type="number" min="0" max="100" step="1" value="${Math.round(x.p)}" title="Edite e pressione Enter" onfocus="this.select()" onchange="salvarPct(${gi},this.value)"><b>%</b></div></td>
      <td>${pill(st(x))}</td>
      <td class="sub">${esc(x.o)||"—"}</td>
      <td><button class="act-btn" onclick="abrirModal(${gi})">✏️</button><button class="act-btn del" onclick="excluir(${gi})">🗑️</button></td>
    </tr>`}).join("")
    :'<tr><td colspan="9" class="empty" style="text-align:center;padding:24px">Nenhuma entrega. <a href="#" onclick="abrirModal();return false">Adicionar?</a></td></tr>'}
  </table></div>`
}

/* ── FRENTES ── */
const FIXAS=["Planejamento Estratégico","APO","Orçamento"];
function frentesExtra(){try{return JSON.parse(localStorage.getItem("frentesExtra")||"[]")}catch(e){return[]}}
function salvarFrentesExtra(a){try{localStorage.setItem("frentesExtra",JSON.stringify(a))}catch(e){}}
function frentes(){return[...new Set([...FIXAS,...frentesExtra(),...uniq("f")])].filter(Boolean)}

function irFrentes(){
  tab="frentes";
  document.querySelectorAll("nav button").forEach(y=>y.classList.toggle("on",y.dataset.t=="frentes"));
  draw();
  setTimeout(()=>{const i=$("#nfNome");if(i)i.focus()},50);
}

function criarFrente(e){
  if(e)e.preventDefault();
  const nome=($("#nfNome").value||"").trim();
  if(!nome){banner("Digite o nome da frente.","");return}
  if(frentes().some(f=>f.toLowerCase()==nome.toLowerCase())){banner("⚠️ Já existe uma frente com esse nome.","");return}
  const ex=frentesExtra();ex.push(nome);salvarFrentesExtra(ex);
  draw();
  banner('✅ Frente "'+esc(nome)+'" criada! Agora você já pode lançar atividades nela.',"ok");
  setTimeout(()=>{const i=$("#nfNome");if(i)i.focus()},50);
}

function removerFrente(i){
  const f=frentes()[i];
  if(D.some(x=>x.f==f)){banner("⚠️ Esta frente tem atividades. Exclua ou mova as atividades antes.","");return}
  if(!confirm('Remover a frente "'+f+'"?'))return;
  salvarFrentesExtra(frentesExtra().filter(x=>x!=f));
  draw();
}

function novaNaFrente(i){abrirModal();$("#fFrente").value=frentes()[i]}

function painelFrentes(){
  const fs=frentes(),ex=frentesExtra();
  return`<div style="max-width:720px;margin:0 auto">
    <div class="card" style="margin-bottom:16px">
      <h3>➕ Criar Nova Frente</h3>
      <form onsubmit="criarFrente(event)" style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="nfNome" type="text" placeholder="Nome da frente (ex.: Gestão de Riscos)" style="flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit">
        <button class="btn btn-primary" type="submit">Criar frente</button>
      </form>
      <p class="sub" style="margin:12px 0 0">A frente fica salva neste navegador e já aparece no formulário e no dashboard. Ela é gravada no Google Sheets junto com a primeira atividade lançada nela.</p>
    </div>
    <div class="card">
      <h3>Frentes (${fs.length})</h3>
      ${fs.map((f,i)=>{const n=D.filter(x=>x.f==f).length;return`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)">
          <div style="flex:1;min-width:0"><i class="dot" style="background:${fcol(f)}"></i><b>${esc(f)}</b>
            <span class="sub">· ${n} ${n==1?"atividade":"atividades"}${n?" · "+avg(D.filter(x=>x.f==f))+"%":""}</span></div>
          <div>
            <button class="act-btn" onclick="novaNaFrente(${i})">＋ Atividade</button>
            ${ex.includes(f)&&!n?`<button class="act-btn del" onclick="removerFrente(${i})">🗑️</button>`:""}
          </div>
        </div>`}).join("")}
    </div>
  </div>`
}

/* ── PAINEL LANÇAR ── */
function painelNovo(){
  return`<div style="max-width:640px;margin:0 auto">
    <div class="card" style="margin-bottom:16px">
      <h3>➕ Lançar Nova Atividade / Entrega</h3>
      <p class="sub" style="margin-bottom:20px">Adicione entregas ao cronograma. Os dados são enviados diretamente ao Google Sheets.</p>
      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:15px" onclick="abrirModal()">＋ Abrir Formulário</button>
    </div>
    <div class="card">
      <h3>Atividades cadastradas (${D.length})</h3>
      ${D.length?D.map((x,i)=>({x,i})).sort((a,b)=>porInicio(a.x,b.x)).map(({x,i})=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)">
          <div style="flex:1;min-width:0">
            <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.d)}</b>
            <span class="sub">${esc(x.f)} · Fim: ${fd(x.e)}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-left:12px">
            ${pill(st(x))}
            <button class="act-btn" onclick="abrirModal(${i})">✏️</button>
            <button class="act-btn del" onclick="excluir(${i})">🗑️</button>
          </div>
        </div>`).join("")
      :'<div class="empty">Nenhuma atividade ainda. Clique em <b>＋ Abrir Formulário</b> acima.</div>'}
    </div>
  </div>`
}

function draw(keep){
  if(tab=="dash")$("#root").innerHTML=dash();
  else if(tab=="cron")$("#root").innerHTML=cron();
  else if(tab=="novo")$("#root").innerHTML=painelNovo();
  else if(tab=="frentes")$("#root").innerHTML=painelFrentes();
  if(keep){const i=$("#qi");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}

/* ── MODAL ── */
function toggleNovaFrente(sel){
  const show=sel.value=="__novo__";
  $("#fFrenteNova").style.display=show?"block":"none";
  if(show)setTimeout(()=>$("#fFrenteNova").focus(),50);
}

function calcStatus(){
  const pct=parseFloat($("#fPct").value)||0;
  const ini=$("#fInicio").value,fim=$("#fFim").value;
  let s="Em andamento";
  if(pct>=100)s="Concluído";
  else if(fim&&fim<T)s="Atrasado";
  else if(pct==0&&ini&&ini>T)s="Não iniciado";
  const el=$("#fStatus");el.value=s;el.style.color=COL[s]||"var(--mu)";
}

function abrirModal(idx){
  $("#formAtividade").reset();
  $("#editIndex").value="";
  $("#fStatus").value="";
  $("#fFrenteNova").style.display="none";
  $("#modalTitulo").textContent="➕ Nova Atividade / Entrega";
  $("#btnSalvar").textContent="💾 Salvar Atividade";
  const sel=$("#fFrente");
  sel.innerHTML=`<option value="">Selecione a frente</option>`
    +frentes().filter(f=>f!="Sem frente").map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")
    +`<option value="__novo__">+ Nova frente...</option>`;
  if(idx!==undefined&&D[idx]){
    const x=D[idx];
    $("#editIndex").value=idx;
    $("#modalTitulo").textContent="✏️ Editar Atividade";
    $("#btnSalvar").textContent="💾 Atualizar";
    if(![...sel.options].some(o=>o.value==x.f))sel.innerHTML+=`<option value="${esc(x.f)}">${esc(x.f)}</option>`;
    sel.value=x.f;
    $("#fEntrega").value=x.d;
    $("#fResponsavel").value=x.r;
    $("#fInicio").value=x.i;
    $("#fFim").value=x.e;
    $("#fPct").value=x.p;
    $("#fObs").value=x.o;
    calcStatus();
  }
  $("#modalOverlay").classList.add("open");
  setTimeout(()=>$("#fEntrega").focus(),100);
}

function fecharModal(){$("#modalOverlay").classList.remove("open")}

function salvarAtividade(e){
  e.preventDefault();
  const frente=$("#fFrente").value=="__novo__"
    ?($("#fFrenteNova").value.trim()||"Nova Frente")
    :$("#fFrente").value;
  const item={
    f:frente||"Sem frente",
    d:$("#fEntrega").value.trim(),
    r:$("#fResponsavel").value.trim(),
    i:$("#fInicio").value,
    e:$("#fFim").value,
    p:Math.max(0,Math.min(100,parseFloat($("#fPct").value)||0)),
    o:$("#fObs").value.trim()
  };
  const idx=$("#editIndex").value;
  if(item.f!="Sem frente"&&!frentes().some(f=>f.toLowerCase()==item.f.toLowerCase())){const ex=frentesExtra();ex.push(item.f);salvarFrentesExtra(ex)}
  fecharModal();
  // Envia ao Sheets via JSONP — sem adicionar localmente (evita duplicação)
  banner('<span class="spin"></span> Salvando no Google Sheets...','info');
  gsCall({
    action: idx!==""?"update":"append",
    frente:item.f, entrega:item.d, responsavel:item.r,
    inicio:item.i, fim:item.e, pct:item.p, obs:item.o,
    editIdx: idx!==""?String(idx):"",
    linha: idx!==""&&D[idx]&&D[idx].l?String(D[idx].l):""
  },
  function(){banner("☁️ Salvo no Google Sheets!","ok");setTimeout(load,1500);},
  function(err){banner("⚠️ Erro ao salvar: "+err,"");}
  );
}

function salvarPct(i,v){
  const x=D[i];if(!x)return;
  const novo=Math.max(0,Math.min(100,parseFloat(v)||0)),antigo=x.p;
  if(novo===antigo){draw();return}
  x.p=novo;draw();
  gsCall({action:"update",somentePct:"1",frente:x.f,entrega:x.d,responsavel:x.r,inicio:x.i,fim:x.e,pct:novo,obs:x.o,editIdx:String(i),linha:x.l?String(x.l):""},
    function(){
      banner('<span class="spin"></span> Conferindo no Google Sheets...','info');
      setTimeout(function(){verificarPct(x,novo)},1500);
    },
    function(err){x.p=antigo;draw();bannerFixo("⚠️ Erro ao salvar: "+esc(err),"")});
}

/* Relê o Sheets e confirma se a % realmente foi gravada */
function verificarPct(x,esperado){
  gsCall({},function(data){
    if(!data.csv)return;
    const novos=build(parseCsv(data.csv),true);
    const y=novos.find(z=>z.d==x.d&&z.f==x.f&&z.r==x.r&&z.i==x.i&&z.e==x.e);
    D=novos;draw();
    if(y&&Math.round(y.p)==Math.round(esperado))bannerFixo("✅ Confirmado: o Sheets gravou "+Math.round(esperado)+"%.","ok",4000);
    else bannerFixo("⚠️ O Google Sheets <b>NÃO gravou</b> a %. "+(y?"Ele continua com <b>"+Math.round(y.p)+"%</b> em":"Não encontrei no Sheets")+' "'+esc(x.d)+'". O problema está no script do Sheets (Apps Script), não na página.',"");
  },function(err){bannerFixo("⚠️ Não consegui conferir no Sheets: "+esc(err),"")});
}

function excluir(i){
  if(!confirm('Excluir "'+D[i].d+'"?'))return;
  banner('<span class="spin"></span> Excluindo...','info');
  gsCall({action:"delete",editIdx:String(i),linha:D[i].l?String(D[i].l):""},
  function(){banner("🗑️ Excluído do Google Sheets!","ok");setTimeout(load,1500);},
  function(err){
    // Fallback local se Sheets inacessível
    D.splice(i,1);draw();
    banner("⚠️ Removido localmente. Erro Sheets: "+err,"");
  });
}

/* ================================================================
   COMUNICAÇÃO COM GOOGLE SHEETS — 100% JSONP (sem CORS)
   Funciona ao abrir o HTML como arquivo local (file://) ou servidor
   ================================================================ */
function gsCall(params, onOk, onErr){
  if(!CONFIG.CSV_URL){if(onErr)onErr("CSV_URL não configurado");return;}
  const cb="gs_"+Date.now()+"_"+Math.floor(Math.random()*99999);
  const s=document.createElement("script");
  const p=new URLSearchParams(params);
  p.set("callback",cb);
  p.set("t",Date.now());

  const timer=setTimeout(function(){
    delete window[cb];
    try{document.head.removeChild(s)}catch(x){}
    if(onErr)onErr("Timeout — reimplante o Web App com Nova Versão e acesso Público");
  },12000);

  window[cb]=function(data){
    clearTimeout(timer);
    delete window[cb];
    try{document.head.removeChild(s)}catch(x){}
    if(data&&(data.status==="ok"||data.csv)){if(onOk)onOk(data);}
    else{if(onErr)onErr((data&&data.message)||JSON.stringify(data));}
  };
  s.onerror=function(){
    clearTimeout(timer);
    delete window[cb];
    try{document.head.removeChild(s)}catch(x){}
    if(onErr)onErr("Script bloqueado — verifique se o Web App está público e reimplantado");
  };
  s.src=CONFIG.CSV_URL+"?"+p.toString();
  document.head.appendChild(s);
}

/* ── CARREGAR DADOS DO SHEETS ── */
function load(){
  const upd=$("#upd");
  upd.innerHTML='<span class="spin"></span>Carregando...';
  gsCall({},
  function(data){
    if(data.csv){
      D=build(parseCsv(data.csv),true);
      $("#ban").innerHTML="";
      upd.textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    } else {
      D=[];upd.textContent="Sem dados";
    }
    draw();
  },
  function(err){
    D=[];
    upd.textContent="Sem conexão";
    $("#ban").innerHTML=`<div class="banner">
      <b>⚠️ Não foi possível conectar ao Google Sheets.</b><br>
      <small>${esc(err)}</small><br><br>
      <b>Como resolver:</b><br>
      1. No Apps Script: <b>Implantar → Gerenciar implantações → ✏️ Editar</b><br>
      2. Selecione <b>Nova versão</b><br>
      3. Confirme <b>"Quem tem acesso: Qualquer pessoa"</b><br>
      4. Clique <b>Implantar</b> e recarregue esta página
    </div>`;
    draw();
  });
}

function bannerFixo(msg,tipo,ms){
  const b=$("#ban");
  b.innerHTML=`<div class="banner ${tipo}">${msg}</div>`;
  if(ms)setTimeout(function(){b.innerHTML=""},ms);
}

function banner(msg,tipo){
  const b=$("#ban");
  b.innerHTML=`<div class="banner ${tipo}">${msg}</div>`;
  setTimeout(function(){if(b)b.innerHTML=""},6000);
}

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    tab=b.dataset.t;
    document.querySelectorAll("nav button").forEach(function(y){y.classList.toggle("on",y==b)});
    draw();
  };
});

load();
if(CONFIG.REFRESH_MIN>0)setInterval(load,CONFIG.REFRESH_MIN*6e4);
</script></body></html>
