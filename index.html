<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma 2027 – Planejamento Estratégico, APO e Orçamento</title>
<style>
:root{color-scheme:light;--bg:#eef1f6;--card:#fff;--tx:#0f172a;--mu:#475569;--bd:#d5dce8;--navy:#0f2747;--ac:#1d4ed8;--ok:#15803d;--ba:#b91c1c;--ni:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:22px 32px 0}
.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;max-width:1320px;margin:auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}h1 small{display:block;font-size:13px;font-weight:400;color:#b4c3dc;margin-top:3px}
.meta{display:flex;gap:12px;align-items:center;color:#b4c3dc;font-size:12px;padding-bottom:6px}
.meta button{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
nav{display:flex;gap:2px;max-width:1320px;margin:14px auto 0}
nav button{background:none;border:0;color:#b4c3dc;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:#60a5fa}
main{max-width:1320px;margin:auto;padding:24px 32px 48px}
.banner{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;box-shadow:0 1px 2px rgba(15,39,71,.06)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{border-top:4px solid var(--ac)}.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.2}.kpi span{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
h3{margin:0 0 16px;font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.row{margin-bottom:14px}.row>div:first-child{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.bar{height:10px;background:#dbe2ee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.donut{width:160px;height:160px;border-radius:50%;margin:6px auto;display:grid;place-items:center}
.donut div{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:700;line-height:1.1}
.donut small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mu)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sub{color:var(--mu);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools select,.tools input{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit}.tools input{min-width:240px}
.tw{overflow-x:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--navy);background:#e6ecf5;padding:12px 14px;border-bottom:2px solid #b9c5d8;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:nth-child(even) td{background:#f8fafc}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pc{display:flex;align-items:center;gap:8px;min-width:120px}.pc .bar{flex:1;height:8px}
.gl{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:center;font-size:12px;margin-bottom:6px}.gl>div:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gt{position:relative;height:18px;background:#f1f4f9;border-radius:4px}.gt span{position:absolute;top:3px;height:12px;border-radius:4px;min-width:4px}
.gt:after{content:"";position:absolute;left:var(--t);top:-3px;bottom:-3px;width:2px;background:var(--ba)}
.empty{color:var(--mu);padding:8px 0}
@media(max-width:640px){header,main{padding-left:16px;padding-right:16px}.gl{grid-template-columns:110px 1fr}}
</style></head><body>
<header><div class="top"><h1 id="ttl">Cronograma 2027<small>Planejamento Estratégico, APO e Orçamento</small></h1>
<div class="meta"><span id="upd"></span><button onclick="load()">Atualizar</button></div></div>
<nav><button class="on" data-t="dash">Dashboard</button><button data-t="cron">Cronograma</button></nav></header>
<main><div id="ban"></div><div id="root"></div></main>

<script>
/* ===== CONFIGURAÇÃO ===== */
const CONFIG = {
  // Cole aqui o link da planilha publicada em CSV (Arquivo > Compartilhar > Publicar na web > CSV).
  CSV_URL: "",
  // Atualização automática (minutos). Use 0 para desligar.
  REFRESH_MIN: 5
};
/* ======================== */

const DEMO=[
["Planejamento Estratégico","Diagnóstico e análise de cenário","A definir","23/11/2026","11/12/2026","0",""],
["Planejamento Estratégico","Definição de direcionadores e metas corporativas","A definir","14/12/2026","22/01/2027","0",""],
["Planejamento Estratégico","Validação com a diretoria","A definir","25/01/2027","05/02/2027","0",""],
["APO","Desdobramento das metas por área","A definir","11/01/2027","12/02/2027","0",""],
["APO","Definição de indicadores e pesos","A definir","15/02/2027","05/03/2027","0",""],
["Orçamento","Premissas macroeconômicas e diretrizes","A definir","01/12/2026","18/12/2026","0",""],
["Orçamento","Elaboração do orçamento pelas áreas","A definir","04/01/2027","26/02/2027","0",""],
["Orçamento","Consolidação e aprovação final","A definir","01/03/2027","19/03/2027","0",""]];

const COL={"Concluído":"#15803d","Em andamento":"#1d4ed8","Atrasado":"#b91c1c","Não iniciado":"#64748b"};
const PAL=["#1d4ed8","#0f766e","#b45309","#7c3aed","#be185d","#0369a1"];
let D=[],tab="dash",F={q:"",f:"",s:"",r:""};
const $=s=>document.querySelector(s),T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
const fd=d=>d?d.split("-").reverse().join("/"):"-";
function pd(s){s=String(s||"").trim();let m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
 if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){let y=m[3].length==2?"20"+m[3]:m[3];return`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
 return""}
function csv(t){const r=[];let w=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){w.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;w.push(f);r.push(w);w=[];f=""}else f+=c}
 if(f||w.length){w.push(f);r.push(w)}return r.filter(a=>a.some(x=>x.trim()))}
function build(rows,hasHead){let ix={f:0,d:1,r:2,i:3,e:4,p:5,o:6};
 if(hasHead){const h=rows.shift().map(norm),g=k=>h.findIndex(x=>x.startsWith(k));
  const m={f:g("frente"),d:g("entrega"),r:g("respons"),i:g("inicio"),e:g("fim"),p:Math.max(g("conclus"),g("perc"),g("pct")),o:g("obs")};
  Object.keys(m).forEach(k=>{if(m[k]>=0)ix[k]=m[k]});}
 return rows.map(a=>({f:(a[ix.f]||"").trim()||"Sem frente",d:(a[ix.d]||"").trim(),r:(a[ix.r]||"").trim()||"Sem responsável",i:pd(a[ix.i]),e:pd(a[ix.e]),
  p:Math.max(0,Math.min(100,parseFloat(String(a[ix.p]||"0").replace("%","").replace(",","."))||0)),o:(a[ix.o]||"").trim()})).filter(x=>x.d)}
const st=x=>x.p>=100?"Concluído":(x.e&&x.e<T)?"Atrasado":(x.p==0&&x.i&&x.i>T)?"Não iniciado":"Em andamento";
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x.p,0)/a.length):0;
const pill=s=>`<span class="pill" style="background:${COL[s]}1f;color:${COL[s]}">${s}</span>`;
const uniq=k=>[...new Set(D.map(x=>x[k]))];
const fcol=f=>PAL[uniq("f").indexOf(f)%PAL.length];
const prog=(l,a,c)=>`<div class="row"><div><span>${esc(l)} <span class="sub">(${a.length})</span></span><b>${avg(a)}%</b></div><div class="bar"><i style="width:${avg(a)}%;background:${c}"></i></div></div>`;

function dash(){const it=D;if(!it.length)return'<div class="card empty">Nenhuma entrega encontrada na planilha.</div>';
 const c={};Object.keys(COL).forEach(k=>c[k]=it.filter(x=>st(x)==k).length);
 let a=0,g=[];Object.keys(COL).forEach(k=>{const n=c[k]/it.length*100;g.push(`${COL[k]} ${a}% ${a+n}%`);a+=n});
 const late=it.filter(x=>st(x)=="Atrasado").sort((x,y)=>x.e<y.e?-1:1),nx=it.filter(x=>x.p<100&&x.e>=T).sort((x,y)=>x.e<y.e?-1:1).slice(0,6);
 const ds=it.flatMap(x=>[x.i,x.e]).filter(Boolean).sort(),mn=ds[0],mx=ds[ds.length-1],sp=(new Date(mx)-new Date(mn))||1,pos=d=>Math.max(0,Math.min(100,(new Date(d)-new Date(mn))/sp*100));
 const list=(l,w)=>l.length?l.map(x=>`<div class="row"><div><span>${esc(x.d)}</span><b style="color:${w?"var(--ba)":"inherit"}">${fd(x.e)}</b></div><div class="sub">${esc(x.r)} · ${esc(x.f)}</div></div>`).join(""):'<div class="empty">Nada por aqui.</div>';
 return`<div class="kpis"><div class="card kpi"><b>${avg(it)}%</b><span>Conclusão geral</span></div><div class="card kpi"><b>${it.length}</b><span>Entregas</span></div><div class="card kpi" style="border-color:var(--ok)"><b style="color:var(--ok)">${c["Concluído"]}</b><span>Concluídas</span></div><div class="card kpi"><b style="color:var(--ac)">${c["Em andamento"]}</b><span>Em andamento</span></div><div class="card kpi" style="border-color:var(--ba)"><b style="color:var(--ba)">${c["Atrasado"]}</b><span>Atrasadas</span></div><div class="card kpi" style="border-color:var(--navy)"><b>${fd(mx)}</b><span>Prazo final</span></div></div>
<div class="grid"><div class="card"><h3>Status das entregas</h3><div class="donut" style="background:conic-gradient(${g.join(",")})"><div>${avg(it)}%<small>concluído</small></div></div><div class="leg">${Object.keys(COL).map(k=>`<span><i class="dot" style="background:${COL[k]}"></i>${k} (${c[k]})</span>`).join("")}</div></div>
<div class="card"><h3>Progresso por frente</h3>${uniq("f").map(f=>prog(f,it.filter(x=>x.f==f),fcol(f))).join("")}</div>
<div class="card"><h3>Progresso por responsável</h3>${uniq("r").map(r=>prog(r,it.filter(x=>x.r==r),"var(--navy)")).join("")}</div></div>
<div class="grid"><div class="card"><h3>Entregas atrasadas</h3>${list(late,1)}</div><div class="card"><h3>Próximos vencimentos</h3>${list(nx)}</div></div>
<div class="card"><h3>Linha do tempo</h3>${it.filter(x=>x.i&&x.e).map(x=>`<div class="gl"><div title="${esc(x.d)}">${esc(x.d)}</div><div class="gt" style="--t:${pos(T)}%"><span style="left:${pos(x.i)}%;width:${Math.max(.6,pos(x.e)-pos(x.i))}%;background:${fcol(x.f)}"></span></div></div>`).join("")}<div class="sub" style="margin-top:10px">Linha vermelha = hoje · ${fd(mn)} a ${fd(mx)}</div></div>`}

function cron(){const q=F.q.toLowerCase(),it=D.filter(x=>(!F.f||x.f==F.f)&&(!F.s||st(x)==F.s)&&(!F.r||x.r==F.r)&&(!q||(x.d+" "+x.r+" "+x.o).toLowerCase().includes(q)));
 const opt=(l,arr,v)=>`<option value="">${l}</option>`+arr.map(a=>`<option ${v==a?"selected":""}>${esc(a)}</option>`).join("");
 return`<div class="tools"><input id="qi" placeholder="Buscar entrega, responsável..." value="${esc(F.q)}" oninput="F.q=this.value;draw(1)"><select onchange="F.f=this.value;draw()">${opt("Todas as frentes",uniq("f"),F.f)}</select><select onchange="F.r=this.value;draw()">${opt("Todos os responsáveis",uniq("r"),F.r)}</select><select onchange="F.s=this.value;draw()">${opt("Todos os status",Object.keys(COL),F.s)}</select></div>
<div class="card tw"><table><tr><th>Frente</th><th style="width:30%">Entrega</th><th>Responsável</th><th>Início</th><th>Fim</th><th>Conclusão</th><th>Status</th><th>Observações</th></tr>
${it.length?it.map(x=>`<tr><td><i class="dot" style="background:${fcol(x.f)}"></i>${esc(x.f)}</td><td>${esc(x.d)}</td><td>${esc(x.r)}</td><td>${fd(x.i)}</td><td>${fd(x.e)}</td><td><div class="pc"><div class="bar"><i style="width:${x.p}%;background:${COL[st(x)]}"></i></div><b>${Math.round(x.p)}%</b></div></td><td>${pill(st(x))}</td><td class="sub">${esc(x.o)}</td></tr>`).join(""):'<tr><td colspan="8" class="empty">Nenhuma entrega com esses filtros.</td></tr>'}</table></div>`}

function draw(keep){$("#root").innerHTML=tab=="dash"?dash():cron();if(keep){const i=$("#qi");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
async function load(){const b=$("#ban");
 if(!CONFIG.CSV_URL){D=build(DEMO.map(r=>r.slice()),false);b.innerHTML='<div class="banner"><b>Modo demonstração.</b> Cole o link da sua planilha em <code>CSV_URL</code>, no início do arquivo index.html, para exibir os dados reais.</div>';$("#upd").textContent="Dados de exemplo";draw();return}
 try{const r=await fetch(CONFIG.CSV_URL+(CONFIG.CSV_URL.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw 0;
  D=build(csv(await r.text()),true);b.innerHTML="";$("#upd").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
 catch(e){b.innerHTML='<div class="banner"><b>Não foi possível carregar a planilha.</b> Confira se ela está publicada na web em formato CSV e se o link está correto.</div>'}
 draw()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(y=>y.classList.toggle("on",y==b));draw()});
load();if(CONFIG.REFRESH_MIN>0)setInterval(load,CONFIG.REFRESH_MIN*6e4);
</script></body></html>
